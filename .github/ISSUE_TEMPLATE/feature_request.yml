name: 💡 Feature Request
description: Suggest an idea or enhancement for LinkLift
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We are always looking for ways to improve LinkLift.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What part of the app would this feature enhance?
      options:
        - Download Options (Formats, Bitrates, Quality)
        - In-App Video/Audio Player
        - Batch / Playlist Management
        - UI / UX / Material 3 Theming
        - Storage / File Management
        - Settings & Preferences
        - Other
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution or new behavior you'd like to see.
      placeholder: "It would be great if LinkLift could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, screenshots, or mockups about the feature request here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues to ensure this feature has not already been requested.
          required: true
